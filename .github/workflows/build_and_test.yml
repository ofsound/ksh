name: KSH CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

jobs:
  macos:
    name: macOS build and tests
    runs-on: macos-26
    timeout-minutes: 45
    env:
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_CACHE_MULTIARCH: '1'
      PRODUCTS: Builds/KSH_artefacts/Release

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Show toolchain
        run: |
          xcodebuild -version
          cmake --version
          ninja --version

      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - name: Configure and build universal macOS products
        run: |
          cmake -S . -B Builds -G Ninja -DCMAKE_BUILD_TYPE=Release \
            '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' \
            -DKSH_COPY_PLUGIN_AFTER_BUILD=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          cmake --build Builds --parallel 4

      - name: Run CTest
        run: |
          ctest --test-dir Builds --output-on-failure --no-tests=error \
            --output-junit "$RUNNER_TEMP/ksh-ctest.xml" \
            --exclude-regex '^(Boot performance|Native editor performance)$'

      - name: Upload CTest results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macos-ctest
          path: ${{ runner.temp }}/ksh-ctest.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Validate the VST3 in pluginval
        timeout-minutes: 10
        run: |
          curl --fail --show-error --silent --location --retry 3 \
            https://github.com/Tracktion/pluginval/releases/download/v1.0.3/pluginval_macOS.zip \
            -o "$RUNNER_TEMP/pluginval.zip"
          ditto -x -k "$RUNNER_TEMP/pluginval.zip" "$RUNNER_TEMP"
          "$RUNNER_TEMP/pluginval.app/Contents/MacOS/pluginval" \
            --strictness-level 10 --verbose --validate "$PRODUCTS/VST3/KSH.vst3"

      - name: Validate the AU MIDI effect in auval
        timeout-minutes: 5
        run: |
          components="$HOME/Library/Audio/Plug-Ins/Components"
          mkdir -p "$components"
          ditto "$PRODUCTS/AU/KSH.component" "$components/KSH.component"
          auval -v aumi Ksh1 Osnd

      - name: Package the macOS bundles
        run: |
          bundles=(Standalone/KSH.app AU/KSH.component VST3/KSH.vst3 CLAP/KSH.clap)
          for bundle in "${bundles[@]}"; do
            binary="$PRODUCTS/$bundle/Contents/MacOS/KSH"
            test -x "$binary"
            lipo -verify_arch arm64 x86_64 "$binary"
          done
          tar -czf "$RUNNER_TEMP/KSH-macOS-universal.tar.gz" -C "$PRODUCTS" "${bundles[@]}"

      - name: Upload macOS bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: ${{ runner.temp }}/KSH-macOS-universal.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS build and AUv3 packaging
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Build unsigned iPhone and iPad app
        run: |
          xcodebuild -version
          cmake --preset ios-xcode
          cmake --build Builds-iOS --config Release --target KSH_Standalone \
            --parallel 4 -- CODE_SIGNING_ALLOWED=NO

      - name: Check the iOS app and embedded AUv3
        run: bash scripts/verify-apple-bundle.sh ios Builds-iOS/KSH_artefacts/Release/Standalone/KSH.app
