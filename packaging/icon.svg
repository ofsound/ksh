<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <defs>
    <linearGradient id="bg" x1="103" y1="103" x2="922" y2="922" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#292e35"/>
      <stop offset="1" stop-color="#21262d"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" stroke="#33373e" stroke-width="2"/>
    </pattern>
    <clipPath id="plateClip">
      <rect x="103" y="103" width="819" height="819" rx="74"/>
    </clipPath>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="0 0 0 0 0.36
                0 0 0 0 0.66
                0 0 0 0 0.95
                0 0 0 0.22 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g clip-path="url(#plateClip)">
    <rect x="103" y="103" width="819" height="819" fill="url(#bg)"/>
    <rect x="103" y="103" width="819" height="819" fill="url(#grid)" opacity="0.55"/>
    <rect x="103" y="103" width="819" height="819" fill="#1e2025" opacity="0.42"/>
  </g>
  <rect x="103" y="103" width="819" height="819" rx="74" stroke="#404854" stroke-width="4"/>

  <g filter="url(#glow)">
    <text x="512" y="570"
      text-anchor="middle"
      font-family="system-ui, -apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif"
      font-size="300"
      font-weight="900"
      letter-spacing="-8">
      <tspan fill="#f59e38">K</tspan><tspan fill="#dbdee5">S</tspan><tspan fill="#5ca8f2">H</tspan>
    </text>
  </g>

  <text x="512" y="700"
    text-anchor="middle"
    font-family="system-ui, -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif"
    font-size="44"
    font-weight="700"
    letter-spacing="18"
    fill="#8c969e">OFSOUND</text>
</svg>
